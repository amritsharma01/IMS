{% extends "base.html" %}

{% block content %}
    {% if message %}
    <ul class="messages">
       <li>{{message}}</li>
    </ul>
    {% endif %}

    <section class="vh-100" style="background-color: #eee;">
        <div class="container h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-lg-12 col-xl-11">
              <div class="card text-black" style="border-radius: 25px;">
                <div class="card-body p-md-5">
                  <div class="row justify-content-center">
                    <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
      
                      <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Add Room</p>
      
                      <form action="{%url "IMSapp:rooms"%}" class="mx-1 mx-md-4" method="POST">
                        {% csrf_token %}
                          <div class="d-flex flex-row align-items-center mb-4">
                            <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                            <div class="form-outline flex-fill mb-0">
                              <input type="text" id="form3Example1c" class="form-control" name="room_number" required="True" />
                              <label class="form-label" for="form3Example1c">Room No</label>
                            </div>
                          </div>
                           <div class="d-flex flex-row align-items-center mb-4">
                            <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                            <div class="form-outline flex-fill mb-0">
                             <select class="form-select" aria-label="Default select example" name="building">
                                <option selected>Select Building</option>
                                  {% for buildingi in buildings%}
                                  <option value="{{buildingi.id}}">{{buildingi.name}}</option>
                                   {% endfor%}
                                </select>
                            </div>
                          </div>
      
      
                        <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                          <button type="submit" class="btn btn-primary btn-lg">Add</button>
                        </div>
                      </form>
                    </div>
    
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="vh-100" style="background-color: #eee;">
        <div class="container h-100">
        
                  <div class="row justify-content-center">
                    <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                      <p class="text-center h2 fw-bold mb-5 mx-1 mx-md-4 mt-4">List of Rooms</p>


<table class="table">
  <thead class="thead-dark">
    <tr>
      <th scope="col">S.N</th>
      <th scope="col">Room No</th>
      <th scope="col">Building</th>
    </tr>
  </thead>
  <tbody>
    {% for room in rooms%}
    <tr>
        <th scope="row">{{forloop.counter}}</th>
      <td>{{room.room_number}}</td>
      <td>{{room.building}}</td>
      {%endfor%}
    </tr>
  </tbody>
</table>
                    </div>
    
          </div>
        </div>
      </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
{% endblock%}
