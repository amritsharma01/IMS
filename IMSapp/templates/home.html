{% extends "base.html" %}

{% block content %}



 

        <div class="container h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
            
                 
      
                      
      {% for notice in notices%}

<div class="card-group">
 <div class="card border-dark mb-3" style="max-width: 18rem;">
  <div class="card-header">Invigilator Assigned</div>
  <div class="card-body text-dark">
    <h5 class="card-title">{{notice.invigilators}}</h5>
    <p class="card-text">Assigned in {{notice.room}}. For the {{notice.shift}} shift. The assigned exam is {{notice.exam}}</p>
    <p class="card-text">Date: {{notice.date}}</p>
  </div>

</div>

 {% endfor %}
                      
                    </div>
    
               
            </div>

{%endblock%}
